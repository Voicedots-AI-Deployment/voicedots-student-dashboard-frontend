<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VoiceDots — Temporarily unavailable</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b14;color:#e5e7eb}
    main{width:min(520px,calc(100% - 40px));padding:38px;border:1px solid #273044;border-radius:18px;background:#111827;text-align:center}
    .mark{width:54px;height:54px;margin:auto;display:grid;place-items:center;border-radius:50%;background:#3b1d1d;color:#fca5a5;font-size:26px}
    h1{font-size:1.5rem;margin:18px 0 10px}p{color:#9ca3af;line-height:1.6}
    button{margin-top:14px;border:0;border-radius:10px;padding:11px 18px;background:var(--brand,#813DF5);color:var(--brand-fg,#fff);font-weight:700;cursor:pointer}
    small{display:block;margin-top:18px;color:#64748b}
  </style>

</head>
<body>
  <main>
    <img src="/voicedotslogo.svg" alt="VoiceDots" width="54" height="54" />
    <h1>VoiceDots is temporarily unavailable</h1>
    <p>The platform could not reach a required service. Your saved interview answers are safe. Wait a moment and try again; if this continues, contact your placement team.</p>
    <button type="button" id="retry">Try again</button>
    <small>No interview score is created from an incomplete session.</small>
  </main>
  <script src="error.js"></script>
</body>
</html>
